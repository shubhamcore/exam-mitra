<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="gcp" x1="0" x2="1">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".33" stop-color="#EA4335"/>
      <stop offset=".66" stop-color="#FBBC04"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="40" font-size="24" font-weight="800" text-anchor="middle" fill="#0f172a">Exam Mitra — Autonomous AI Study Planner Architecture</text>
  <text x="600" y="64" font-size="13" fill="#64748b" text-anchor="middle">Built on Google ADK · Gemini 3.5 Flash · Cloud Run · Firestore · Server-Sent Events</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="160" height="80" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="120" y="155" font-size="28" text-anchor="middle">🧑‍🎓</text>
    <text x="120" y="182" font-size="13" font-weight="600" text-anchor="middle" fill="#1e293b">Student Browser</text>
  </g>

  <!-- Cloud Run box -->
  <g>
    <rect x="260" y="95" width="680" height="570" rx="20" fill="white" stroke="url(#gcp)" stroke-width="3" stroke-dasharray="0"/>
    <rect x="260" y="95" width="680" height="34" rx="20" fill="url(#gcp)"/>
    <text x="600" y="118" font-size="13" font-weight="700" text-anchor="middle" fill="white">Google Cloud Run · FastAPI + Uvicorn (Python 3.11)</text>
  </g>

  <!-- API Gateway -->
  <g filter="url(#shadow)">
    <rect x="300" y="150" width="180" height="60" rx="10" fill="url(#g1)"/>
    <text x="390" y="177" font-size="13" font-weight="700" text-anchor="middle" fill="white">POST /api/start</text>
    <text x="390" y="195" font-size="11" text-anchor="middle" fill="#e0e7ff">+ SSE /api/jobs/:id/stream</text>
  </g>

  <!-- 7-step ADK pipeline -->
  <g filter="url(#shadow)">
    <rect x="520" y="145" width="390" height="230" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="715" y="172" font-size="13" font-weight="700" text-anchor="middle" fill="#92400e">🤖 Google ADK Agent Pipeline (LlmAgent chain)</text>

    <!-- Steps -->
    <g font-size="11" font-weight="600">
      <rect x="540" y="185" width="100" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="590" y="202" text-anchor="middle" fill="#92400e">① Syllabus</text>
      <text x="590" y="217" text-anchor="middle" fill="#b45309" font-size="9">Parser</text>

      <rect x="655" y="185" width="100" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="705" y="202" text-anchor="middle" fill="#92400e">② Study</text>
      <text x="705" y="217" text-anchor="middle" fill="#b45309" font-size="9">Planner</text>

      <rect x="770" y="185" width="120" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="830" y="202" text-anchor="middle" fill="#92400e">③ Resource</text>
      <text x="830" y="217" text-anchor="middle" fill="#b45309" font-size="9">Finder (curated + DDG)</text>

      <rect x="540" y="240" width="100" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="590" y="257" text-anchor="middle" fill="#92400e">④ Notes</text>
      <text x="590" y="272" text-anchor="middle" fill="#b45309" font-size="9">Generator</text>

      <rect x="655" y="240" width="100" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="705" y="257" text-anchor="middle" fill="#92400e">⑤ Flashcards</text>
      <text x="705" y="272" text-anchor="middle" fill="#b45309" font-size="9">Active recall</text>

      <rect x="770" y="240" width="120" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="830" y="257" text-anchor="middle" fill="#92400e">⑥ MCQs</text>
      <text x="830" y="272" text-anchor="middle" fill="#b45309" font-size="9">+ explanations</text>

      <rect x="600" y="300" width="230" height="40" rx="8" fill="#fff" stroke="#f59e0b"/>
      <text x="715" y="317" text-anchor="middle" fill="#92400e">⑦ Weak-Area Grader</text>
      <text x="715" y="332" text-anchor="middle" fill="#b45309" font-size="9">after student practices MCQs</text>
    </g>

    <text x="715" y="360" font-size="10" text-anchor="middle" fill="#92400e" font-style="italic">Each step: retry w/ backoff · model fallback · JSON schema validation</text>
  </g>

  <!-- Gemini -->
  <g filter="url(#shadow)">
    <rect x="300" y="300" width="180" height="75" rx="14" fill="url(#g2)"/>
    <text x="390" y="328" font-size="13" font-weight="700" text-anchor="middle" fill="white">✨ Gemini 3.5 Flash</text>
    <text x="390" y="348" font-size="11" text-anchor="middle" fill="#fce7f3">via google-adk (GoogleLlm)</text>
    <text x="390" y="365" font-size="10" text-anchor="middle" fill="#fbcfe8">Vertex AI in cloud · API key locally</text>
  </g>

  <!-- Firestore -->
  <g filter="url(#shadow)">
    <rect x="300" y="430" width="180" height="80" rx="14" fill="#1e293b"/>
    <text x="390" y="460" font-size="20" text-anchor="middle">🔥</text>
    <text x="390" y="482" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">Firestore</text>
    <text x="390" y="500" font-size="10" text-anchor="middle" fill="#94a3b8">StudyPackage state</text>
  </g>

  <!-- SSE broadcast -->
  <g filter="url(#shadow)">
    <rect x="520" y="430" width="390" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="715" y="457" font-size="12" font-weight="700" text-anchor="middle" fill="#065f46">⚡ Real-time SSE Broadcast</text>
    <text x="715" y="477" font-size="11" text-anchor="middle" fill="#047857">progress · step_complete · complete · error (live updates to UI)</text>
  </g>

  <!-- Static frontend -->
  <g filter="url(#shadow)">
    <rect x="520" y="520" width="390" height="110" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/>
    <text x="715" y="547" font-size="12" font-weight="700" text-anchor="middle" fill="#312e81">🎨 Vanilla HTML/CSS/JS Frontend</text>
    <text x="560" y="570" font-size="11" fill="#475569">• Hero form · live progress steps</text>
    <text x="560" y="588" font-size="11" fill="#475569">• Tabs: Plan · Resources · Notes · Flashcards · MCQs</text>
    <text x="560" y="606" font-size="11" fill="#475569">• Flip flashcards · MCQ grading · shareable /plan/:id</text>
    <text x="560" y="622" font-size="11" fill="#475569">• SEO/OG meta for social sharing</text>
  </g>

  <!-- Share URL -->
  <g filter="url(#shadow)">
    <rect x="990" y="200" width="180" height="80" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="1080" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#0c4a6e">🔗 Shareable Plan</text>
    <text x="1080" y="250" font-size="11" text-anchor="middle" fill="#0369a1">/plan/{job_id}</text>
    <text x="1080" y="268" font-size="10" text-anchor="middle" fill="#075985">Jinja2 SSR · SEO/OG tags</text>
  </g>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200,160 L290,175"/>
    <path d="M480,180 L510,180"/>
    <path d="M480,335 Q500,300 530,260"/>
    <path d="M390,210 L390,295"/>
    <path d="M390,375 L390,425"/>
    <path d="M600,430 L600,410" stroke="#10b981"/>
    <path d="M715,380 L715,425" stroke="#10b981"/>
    <path d="M830,430 L830,410" stroke="#10b981"/>
    <path d="M480,470 L515,455" stroke="#f59e0b"/>
    <path d="M915,460 L985,240" stroke="#0ea5e9" stroke-dasharray="4 3"/>
    <path d="M715,520 L715,495"/>
    <path d="M290,470 Q250,470 250,650 Q250,680 520,680 Q900,680 900,575" stroke="#6366f1" stroke-dasharray="4 3"/>
  </g>

  <!-- Legend -->
  <g>
    <rect x="40" y="680" width="1120" height="60" rx="12" fill="white" stroke="#e2e8f0"/>
    <text x="60" y="705" font-size="11" font-weight="700" fill="#334155">Why it's agentic (not a chatbot):</text>
    <text x="60" y="725" font-size="11" fill="#475569">A single user click triggers an autonomous 7-step pipeline across multiple specialized ADK agents — each with its own system prompt, structured I/O schema, retries, and model fallback — then streams progress back in real-time and produces a shareable study package.</text>
  </g>
</svg>
